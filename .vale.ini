# Vale settings shared by VS Code, the pre-commit hook, and CI.
# Tool versions are pinned in scripts/docs-quality/install-tools.mjs.
StylesPath = .vale/styles

# Suggestions appear in VS Code only. Warnings and errors block commits and
# pull requests when they're on lines you added or changed.
MinAlertLevel = suggestion

# Pinned Microsoft Writing Style Guide package. Run `npm run setup` after
# changing the version.
Packages = https://github.com/errata-ai/Microsoft/releases/download/v0.15.1/Microsoft.zip

# Generated from docs-review/docs-terms.txt (the single source of truth for
# custom vocabulary). Don't edit .vale/styles/config/vocabularies by hand.
Vocab = Docs

# Skip front matter, code blocks, and inline code.
IgnoredScopes = code, tt, frontmatter

[*.{md,mdx}]
BasedOnStyles = Vale, Microsoft, Docs

# Skip MDX import and export statements.
BlockIgnores = (?m)^(?:import|export)\s.*$

# cspell owns spelling, so Vale's spelling and term-casing checks are off.
# Vale.Terms would force dictionary casing ("relying" at the start of a sentence).
Vale.Spelling = NO
Vale.Terms = NO

# Active voice: passive constructions block the pull request.
Microsoft.Passive = error

# Docs.Headings replaces Microsoft.Headings with an error-level sentence-case rule.
Microsoft.Headings = NO

name: Automated Doc Review

on:
  pull_request:
    paths:
      - 'docs/**/*.md'
      - 'docs/**/*.mdx'
      - 'docs/*.md'
      - 'docs/*.mdx'
      - '.github/workflows/doc-review.yml'
      - '.github/scripts/doc_review.py'
      - 'docs/.vale.ini'
      - 'docs/styles/**'
      - 'docs-review/.markdownlint.yaml'

permissions:
  contents: read

jobs:
  lint:
    name: Documentation lint
    runs-on: ubuntu-latest
    steps:
      - name: Check out pull request
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Find changed documentation
        id: changed
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python .github/scripts/doc_review.py changed-files

      - name: Vale (Microsoft style)
        if: steps.changed.outputs.has_files == 'true'
        uses: vale-cli/vale-action@v3
        with:
          files: docs
          fail_on_error: false
          config: docs/.vale.ini

      - name: Markdown lint
        if: steps.changed.outputs.has_files == 'true'
        uses: DavidAnson/markdownlint-cli2-action@v24
        with:
          config: docs-review/.markdownlint.yaml
          globs: ${{ steps.changed.outputs.globs }}

  ai-review:
    name: Local AI documentation review
    # The local model is available only on the self-hosted runner. Restrict it to
    # same-repository PRs from trusted contributors; fork PR content is untrusted.
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.pull_request.author_association)
    runs-on: self-hosted
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Check out pull request
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Find changed documentation
        id: changed
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python .github/scripts/doc_review.py changed-files

      - name: Generate local AI review
        id: review
        if: steps.changed.outputs.has_files == 'true'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          RUNNER_TEMP: ${{ runner.temp }}
        run: python .github/scripts/doc_review.py ai-review

      - name: Post or update AI review comment
        if: steps.changed.outputs.has_files == 'true'
        uses: actions/github-script@v7
        env:
          REVIEW_FILE: ${{ steps.review.outputs.review_file }}
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- automated-doc-review -->';
            const review = fs.readFileSync(process.env.REVIEW_FILE, 'utf8').trim();
            if (!review) {
              throw new Error('The local AI review returned an empty response.');
            }

            const body = `${marker}\n### AI Documentation Review (local DeepSeek)\n\n${review}`;
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number,
              per_page: 100,
            });
            const existing = comments.find((comment) =>
              comment.user?.type === 'Bot' && comment.body?.includes(marker)
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

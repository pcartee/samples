name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build

      - name: Upload site artifact
        uses: actions/upload-artifact@v7
        with:
          name: production-site
          path: build/
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: gh-pages-publish
      cancel-in-progress: false
    steps:
      - name: Check out main
        uses: actions/checkout@v5
        with:
          ref: main

      - name: Download site artifact
        uses: actions/download-artifact@v8
        with:
          name: production-site
          path: build/

      - name: Check whether this build is current
        id: freshness
        env:
          BUILD_SHA: ${{ github.sha }}
        run: |
          if [[ "$(git rev-parse HEAD)" == "$BUILD_SHA" ]]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "Production branch advanced after this build; skipping stale artifact."
            echo "current=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Configure Git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Publish site and retain PR previews
        if: steps.freshness.outputs.current == 'true'
        run: bash .github/scripts/deploy-pages.sh
